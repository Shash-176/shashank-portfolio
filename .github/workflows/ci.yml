name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type-check and validate content
        run: npm run check
      - name: Unit tests (content rules, evidence, presence)
        run: npm test
      - name: Build
        run: npm run build
      - name: Performance budget
        run: npm run budget
      - name: Release check (secrets, private links, metadata)
        run: node scripts/release-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  browsers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Behaviour, no-JS, print and accessibility (Chromium)
        run: npm run test:e2e
      - name: Behaviour and no-JS (Firefox, WebKit)
        run: npm run test:browsers
      - name: Lighthouse (LCP, CLS, TBT)
        run: |
          npm run preview &
          npx -y wait-on http://localhost:4321
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") npm run perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
